<line x1="1085.0" y1="746" x2="185.0" y2="746" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#oah_grey)"/>
<text x="185.0" y="804" font-size="12.5" font-style="italic" text-anchor="start" fill="#B03A2E">not stopped within timeout -&gt; error 5032</text>
<text x="185.0" y="847" font-size="13" text-anchor="middle" fill="#1F2937">force-destroy application-owned relay queues</text>
