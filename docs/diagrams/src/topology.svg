<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1600" height="960" fill="white"/>
<defs>
<marker id="m_blue" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#2B6CB0"/></marker>
<marker id="m_orange" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#C0651A"/></marker>
<marker id="m_green" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#2F7D4F"/></marker>
<marker id="m_grey" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#6B7280"/></marker>
<marker id="m_red" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#B03A2E"/></marker>
</defs>
<text x="34" y="42" font-size="22" font-weight="bold" fill="#1F2937">Figure 1. Runtime topology: control plane and data plane</text>
<line x1="230.0" y1="395" x2="600" y2="230.0" stroke="#2B6CB0" stroke-width="2.4" stroke-dasharray="8,6" marker-end="url(#m_blue)"/>
<text x="415.0" y="302.5" font-size="14" text-anchor="middle" fill="#2B6CB0">reads snapshot</text>
<line x1="1140" y1="230.0" x2="990" y2="230.0" stroke="#C0651A" stroke-width="2.4" marker-end="url(#m_orange)"/>
<text x="1065.0" y="220.0" font-size="14" text-anchor="middle" fill="#C0651A">posts snapshot</text>
<line x1="1340.0" y1="310" x2="1340.0" y2="400" stroke="#C0651A" stroke-width="2.4" stroke-dasharray="8,6" marker-end="url(#m_orange)"/>
<text x="1340.0" y="347.0" font-size="14" text-anchor="middle" fill="#C0651A">launch / stop</text>
<line x1="400" y1="485.0" x2="1140" y2="460.0" stroke="#2B6CB0" stroke-width="2.4" marker-end="url(#m_blue)"/>
<text x="770.0" y="462.5" font-size="14" text-anchor="middle" fill="#2B6CB0">enqueue LogStatementMsg</text>
<line x1="400" y1="485.0" x2="1140" y2="605.0" stroke="#2B6CB0" stroke-width="2.4" marker-end="url(#m_blue)"/>
<line x1="400" y1="485.0" x2="1140" y2="750.0" stroke="#2B6CB0" stroke-width="2.4" marker-end="url(#m_blue)"/>
<rect x="60" y="395" width="340" height="180" rx="12" ry="12" fill="#E8EEF7" stroke="#2B5C8A" stroke-width="2"/>
<text x="230.0" y="463.0" font-size="17" font-weight="bold" text-anchor="middle" fill="#1F2937">Application VIs</text>
<text x="230.0" y="487.0" font-size="13.5" text-anchor="middle" fill="#5b6472">hold Logger facade</text>
<text x="230.0" y="509.0" font-size="13.5" text-anchor="middle" fill="#5b6472">(many call sites)</text>
<rect x="600" y="150" width="390" height="160" rx="12" ry="12" fill="#EEF0F2" stroke="#6B7280" stroke-width="2"/>
<text x="795.0" y="208.0" font-size="17" font-weight="bold" text-anchor="middle" fill="#1F2937">Notifier</text>
<text x="795.0" y="232.0" font-size="13.5" text-anchor="middle" fill="#5b6472">snapshot: threshold +</text>
<text x="795.0" y="254.0" font-size="13.5" text-anchor="middle" fill="#5b6472">{id, enqueuer} entries</text>
<rect x="1140" y="150" width="400" height="160" rx="12" ry="12" fill="#FBEBD7" stroke="#C0651A" stroke-width="2"/>
<text x="1340.0" y="219.0" font-size="17" font-weight="bold" text-anchor="middle" fill="#1F2937">Log Manager</text>
<text x="1340.0" y="243.0" font-size="13.5" text-anchor="middle" fill="#5b6472">root actor (control plane)</text>
<rect x="1140" y="400" width="400" height="120" rx="12" ry="12" fill="#DCE9F5" stroke="#2B6CB0" stroke-width="2"/>
<text x="1340.0" y="449.0" font-size="17" font-weight="bold" text-anchor="middle" fill="#1F2937">File Appender</text>
<text x="1340.0" y="473.0" font-size="13.5" text-anchor="middle" fill="#5b6472">own queue -&gt; rolling files</text>
<rect x="1140" y="545" width="400" height="120" rx="12" ry="12" fill="#DCE9F5" stroke="#2B6CB0" stroke-width="2"/>
<text x="1340.0" y="594.0" font-size="17" font-weight="bold" text-anchor="middle" fill="#1F2937">Console Appender</text>
<text x="1340.0" y="618.0" font-size="13.5" text-anchor="middle" fill="#5b6472">own queue -&gt; console</text>
<rect x="1140" y="690" width="400" height="120" rx="12" ry="12" fill="#DCE9F5" stroke="#2B6CB0" stroke-width="2"/>
<text x="1340.0" y="739.0" font-size="17" font-weight="bold" text-anchor="middle" fill="#1F2937">Relay Appender</text>
<text x="1340.0" y="763.0" font-size="13.5" text-anchor="middle" fill="#5b6472">own queue -&gt; application</text>
<line x1="70" y1="895" x2="140" y2="895" stroke="#2B6CB0" stroke-width="2.6"/>
<text x="154" y="900" font-size="15" fill="#3a4250">data plane (log statements)</text>
<line x1="500" y1="895" x2="570" y2="895" stroke="#C0651A" stroke-width="2.6" stroke-dasharray="8,6"/>
<text x="584" y="900" font-size="15" fill="#3a4250">control plane (manager posts / launches)</text>
</svg>