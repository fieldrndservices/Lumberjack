<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="1150" viewBox="0 0 1270 1150" font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="1270" height="1150" fill="white"/>
<defs>
