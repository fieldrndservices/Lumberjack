<marker id="oah_orange" markerWidth="12" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#C0651A" stroke-width="1.3"/></marker>
<marker id="ah_green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#2F7D4F"/></marker>
<marker id="oah_green" markerWidth="12" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#2F7D4F" stroke-width="1.3"/></marker>
