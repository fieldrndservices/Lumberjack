<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="1220" viewBox="0 0 1270 1220" font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="1270" height="1220" fill="white"/>
<defs>
<marker id="ah_blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#2B6CB0"/></marker>
<marker id="oah_blue" markerWidth="12" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#2B6CB0" stroke-width="1.3"/></marker>
<marker id="ah_orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#C0651A"/></marker>
<marker id="oah_orange" markerWidth="12" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#C0651A" stroke-width="1.3"/></marker>
<marker id="ah_green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#2F7D4F"/></marker>
<marker id="oah_green" markerWidth="12" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#2F7D4F" stroke-width="1.3"/></marker>
<marker id="ah_grey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#6B7280"/></marker>
<marker id="oah_grey" markerWidth="12" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#6B7280" stroke-width="1.3"/></marker>
<marker id="ah_red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#B03A2E"/></marker>
<marker id="oah_red" markerWidth="12" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#B03A2E" stroke-width="1.3"/></marker>
</defs>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#1F2937">Figure 5. Register and unregister an appender at runtime</text>
<line x1="185.0" y1="120" x2="185.0" y2="1194" stroke="#B7BEC7" stroke-width="1.4" stroke-dasharray="3,4"/>
<line x1="485.0" y1="120" x2="485.0" y2="1194" stroke="#B7BEC7" stroke-width="1.4" stroke-dasharray="3,4"/>
<line x1="785.0" y1="120" x2="785.0" y2="1194" stroke="#B7BEC7" stroke-width="1.4" stroke-dasharray="3,4"/>
<line x1="1085.0" y1="120" x2="1085.0" y2="1194" stroke="#B7BEC7" stroke-width="1.4" stroke-dasharray="3,4"/>
<line x1="30" y1="172" x2="1240" y2="172" stroke="#D7DCE2" stroke-width="1.2"/><text x="40" y="190" font-size="14" font-weight="bold" fill="#2F7D4F">Register</text>
<text x="335.0" y="198" font-size="13" text-anchor="middle" fill="#1F2937">RegisterAppender -&gt; RegisterAppenderMsg(configured Appender)</text>
<line x1="185.0" y1="206" x2="485.0" y2="206" stroke="#2B6CB0" stroke-width="1.8" marker-end="url(#ah_blue)"/>
<text x="785.0" y="256" font-size="13" text-anchor="middle" fill="#1F2937">Launch Nested Actor</text>
<line x1="485.0" y1="264" x2="1085.0" y2="264" stroke="#C0651A" stroke-width="1.8" marker-end="url(#ah_orange)"/>
<text x="785.0" y="314" font-size="13" text-anchor="middle" fill="#1F2937">appender enqueuer</text>
<line x1="1085.0" y1="322" x2="485.0" y2="322" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#oah_grey)"/>
<text x="485.0" y="391" font-size="13" text-anchor="middle" fill="#1F2937">append RegistryEntry{id, enqueuer}</text>
<path d="M485.0,404 h26 v18 h-26" fill="none" stroke="#C0651A" stroke-width="1.8" marker-end="url(#ah_orange)"/>
<text x="635.0" y="436" font-size="13" text-anchor="middle" fill="#1F2937">PostSnapshot (+ {id, enqueuer})</text>
<line x1="485.0" y1="444" x2="785.0" y2="444" stroke="#C0651A" stroke-width="1.8" marker-end="url(#ah_orange)"/>
<text x="485.0" y="494" font-size="13" text-anchor="middle" fill="#1F2937">WaitForSnapshot(IDPresent, id)</text>
<line x1="185.0" y1="502" x2="785.0" y2="502" stroke="#2B6CB0" stroke-width="1.8" marker-end="url(#ah_blue)"/>
<text x="485.0" y="552" font-size="13" text-anchor="middle" fill="#1F2937">id present -&gt; appender is live</text>
<line x1="785.0" y1="560" x2="185.0" y2="560" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#oah_grey)"/>
<text x="185.0" y="618" font-size="12.5" font-style="italic" text-anchor="start" fill="#6B7280">returns only once the id appears; next Log reaches it</text>
<text x="185.0" y="634" font-size="12.5" font-style="italic" text-anchor="start" fill="#6B7280">(§5.11)</text>
<line x1="30" y1="680" x2="1240" y2="680" stroke="#D7DCE2" stroke-width="1.2"/><text x="40" y="698" font-size="14" font-weight="bold" fill="#B03A2E">Unregister</text>
<text x="335.0" y="706" font-size="13" text-anchor="middle" fill="#1F2937">UnregisterAppender -&gt; UnregisterAppenderMsg(id)</text>
<line x1="185.0" y1="714" x2="485.0" y2="714" stroke="#2B6CB0" stroke-width="1.8" marker-end="url(#ah_blue)"/>
<text x="485.0" y="783" font-size="13" text-anchor="middle" fill="#1F2937">remove RegistryEntry(id)</text>
<path d="M485.0,796 h26 v18 h-26" fill="none" stroke="#C0651A" stroke-width="1.8" marker-end="url(#ah_orange)"/>
<text x="635.0" y="828" font-size="13" text-anchor="middle" fill="#1F2937">PostSnapshot (- id)</text>
<line x1="485.0" y1="836" x2="785.0" y2="836" stroke="#C0651A" stroke-width="1.8" marker-end="url(#ah_orange)"/>
<text x="785.0" y="886" font-size="13" text-anchor="middle" fill="#1F2937">Stop (framework)</text>
<line x1="485.0" y1="894" x2="1085.0" y2="894" stroke="#C0651A" stroke-width="1.8" marker-end="url(#ah_orange)"/>
<text x="1085.0" y="963" font-size="13" text-anchor="middle" fill="#1F2937">flush + close sink</text>
<path d="M1085.0,976 h26 v18 h-26" fill="none" stroke="#2F7D4F" stroke-width="1.8" marker-end="url(#ah_green)"/>
<text x="485.0" y="1008" font-size="13" text-anchor="middle" fill="#1F2937">WaitForSnapshot(IDAbsent, id)</text>
<line x1="185.0" y1="1016" x2="785.0" y2="1016" stroke="#2B6CB0" stroke-width="1.8" marker-end="url(#ah_blue)"/>
<text x="485.0" y="1066" font-size="13" text-anchor="middle" fill="#1F2937">id absent -&gt; unregistered</text>
<line x1="785.0" y1="1074" x2="185.0" y2="1074" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#oah_grey)"/>
<text x="185.0" y="1132" font-size="12.5" font-style="italic" text-anchor="start" fill="#B03A2E">unknown id: already absent -&gt; returns immediately (benign</text>
<text x="185.0" y="1148" font-size="12.5" font-style="italic" text-anchor="start" fill="#B03A2E">no-op)</text>
<rect x="90.0" y="64" width="190" height="56" rx="9" ry="9" fill="#E8EEF7" stroke="#2B5C8A" stroke-width="1.8"/>
<text x="185.0" y="88" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">Application</text>
<text x="185.0" y="106" font-size="11" text-anchor="middle" fill="#6B7280">via Logger</text>
<rect x="390.0" y="64" width="190" height="56" rx="9" ry="9" fill="#FBEBD7" stroke="#C0651A" stroke-width="1.8"/>
<text x="485.0" y="88" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">LogManager</text>
<text x="485.0" y="106" font-size="11" text-anchor="middle" fill="#6B7280">root actor</text>
<rect x="690.0" y="64" width="190" height="56" rx="9" ry="9" fill="#EEF0F2" stroke="#6B7280" stroke-width="1.8"/>
<text x="785.0" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">snapshotNotifier</text>
<rect x="990.0" y="64" width="190" height="56" rx="9" ry="9" fill="#E3EFE7" stroke="#2F7D4F" stroke-width="1.8"/>
<text x="1085.0" y="88" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">Appender</text>
<text x="1085.0" y="106" font-size="11" text-anchor="middle" fill="#6B7280">nested actor</text>
</svg>